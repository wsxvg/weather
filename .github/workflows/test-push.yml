name: 测试定时推送功能

on:
  schedule:
    # 北京时间21:20执行（UTC 13:20）
    - cron: '20 13 * * *'
  workflow_dispatch:  # 支持手动触发测试

permissions:
  contents: read

jobs:
  test-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests>=2.31.0 beautifulsoup4>=4.12.0 zhdate>=0.1 lxml>=4.9.0 -i https://pypi.tuna.tsinghua.edu.cn/simple
        
    - name: 验证时间设置
      run: |
        echo "UTC时间: $(date -u)"
        echo "北京时间: $(TZ=Asia/Shanghai date)"
        echo "预期执行时间: 北京时间21:20"
        
    - name: 执行测试推送
      run: python weather.py
      env:
        TZ: Asia/Shanghai
