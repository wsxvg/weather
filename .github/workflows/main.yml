name: 微信天气推送

on:
  schedule:
    # 北京时间早上7点执行（UTC 23点）
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  weather-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests>=2.31.0 beautifulsoup4>=4.12.0 zhdate>=0.1 lxml>=4.9.0
        
    - name: 执行天气推送
      run: python weather.py
